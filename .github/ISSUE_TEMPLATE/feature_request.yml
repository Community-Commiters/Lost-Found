name: Feature request
description: Suggest an improvement or new capability for the bot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected (students, staff, Student Affairs, admins) and what is hard today?
      placeholder: "As a student who lost a charger, I can't ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view? Mention commands, buttons, or messages if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reporting flow (found / lost)
        - Search and browsing
        - Contact requests and claims
        - Admin and moderation
        - Publishing and schedule
        - Campus locations list
        - Messages and wording
        - Tests / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Related requirement (optional)
      description: ID from the System Requirements Document, if this relates to one.
      placeholder: "FR-04, NFR-02, ..."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or workarounds you use today.

  - type: textarea
    id: privacy
    attributes:
      label: Privacy or moderation impact
      description: Could this expose contact details or make abuse easier? (Contact details must stay out of public channel posts.)

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
        - label: I'm willing to help implement or test this.
